name: Release

# Pushing a tag such as v0.1.0 builds and publishes the three images to GHCR:
#   ghcr.io/selfhostr/orch-server, ghcr.io/selfhostr/orch-web, ghcr.io/selfhostr/orch-agent
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  NAMESPACE: selfhostr

jobs:
  # Nothing is built or pushed unless the tag is on main and CI is green on that commit.
  guard:
    name: Tag is on main and CI is green
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read the workflow runs of the tagged commit.
      actions: read
    outputs:
      stable: ${{ steps.guard.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and branches: the guard checks that the tag commit is an ancestor of main.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: ./scripts/release-guard.sh "$TAG" "$SHA" "$REPO"

  publish:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Push to ghcr.io.
      packages: write
      # Sigstore keyless signature and build provenance (OIDC).
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: orch-server
            file: docker/server.Dockerfile
          - image: orch-web
            file: docker/web.Dockerfile
          - image: orch-agent
            file: apps/agent/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` only moves for a stable version (no pre-release suffix), decided by the guard job.
            type=raw,value=latest,enable=${{ needs.guard.outputs.stable == 'true' }}
      - name: Version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          # SPDX SBOM and SLSA provenance, attached to the image index.
          sbom: true
          provenance: mode=max
          build-args: |
            ORCH_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Keyless signature of the image index (identity: this workflow, from the tag).
      - name: Sign the image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF@$DIGEST"
      # Verify with: gh attestation verify oci://ghcr.io/selfhostr/<image>:<tag> -R selfhostr/orch
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
